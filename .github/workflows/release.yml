name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        run: |
          uv venv --python 3.12
          uv pip install "claudio-tts @ git+https://github.com/restante/claudio-tts@main"
          uv pip install --no-deps -e .
          uv pip install segno psutil numpy pytest
          uv run --no-sync pytest -q
      - name: Notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "claudio-vibecode $v" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "claudio-vibecode $GITHUB_REF_NAME" --notes-file notes.md
