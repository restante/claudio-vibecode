name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (claudio-tts from git, then this package)
        shell: bash
        run: |
          uv venv --python 3.12
          PY=$(ls .venv/bin/python .venv/Scripts/python.exe 2>/dev/null | head -1 || true)
          uv pip install --python "$PY" "claudio-tts @ git+https://github.com/restante/claudio-tts@${CLAUDIO_TTS_REF:-main}"
          uv pip install --python "$PY" --no-deps -e .
          uv pip install --python "$PY" segno psutil numpy pytest ruff
      - name: Lint
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest -q

  hub-smoke:
    name: Hub smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CLAUDIO_TTS_HOME: ${{ github.workspace }}/.ct/home
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.ct/claude
      CLAUDIO_VIBECODE_PORT: "47998"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Starts the hub, pairs, stops it
        shell: bash
        run: |
          uv venv --python 3.12 .ct/venv
          PY=$(ls .ct/venv/bin/python .ct/venv/Scripts/python.exe 2>/dev/null | head -1 || true)
          uv pip install --python "$PY" "claudio-tts @ git+https://github.com/restante/claudio-tts@${CLAUDIO_TTS_REF:-main}"
          uv pip install --python "$PY" .
          "$PY" -m claudio_vibecode install-mod --python "$PY"
          test -d "$CLAUDE_CONFIG_DIR/mods/claudio-vibecode"
          "$PY" -m claudio_vibecode start
          "$PY" -m claudio_vibecode qr --no-browser | grep -q "pair="
          "$PY" -m claudio_vibecode status
          "$PY" -c "from claudio_tts import sinks; assert 'phone' in sinks.factories(), 'phone output not registered'"
          "$PY" -m claudio_vibecode stop
          ! "$PY" -m claudio_vibecode info
          "$PY" -m claudio_vibecode uninstall-mod
      - name: Hub log (on failure)
        if: failure()
        shell: bash
        run: cat .ct/home/vibecode/hub.log || true
