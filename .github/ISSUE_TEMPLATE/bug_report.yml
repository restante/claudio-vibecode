name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! The most common snags: the phone must be on the same Wi-Fi as the computer, and Windows asks once to allow `python.exe` on private networks.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows 10/11, Linux, Other]
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostic report
      description: Run `claudio-vibecode doctor` and `claudio-vibecode status` (or `python -m claudio_vibecode doctor` from the install's Python) and paste the output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include any error text. Worker errors are in `worker.log` in the install's `state` folder.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. /vibe
        2. scan the QR with ...
        3. ...
