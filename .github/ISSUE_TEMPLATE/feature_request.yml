name: Feature request
description: An idea to make claudio-vibecode better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the moment that is awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
  - type: checkboxes
    id: help
    attributes:
      label: Want to help?
      options:
        - label: I'd be happy to try a build or test it on my machine
        - label: I'd like to work on this myself
