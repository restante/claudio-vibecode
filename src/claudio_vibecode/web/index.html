<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<link rel="manifest" href="/manifest.webmanifest">
<title>Claudio vibecode</title>
<style>
  :root { --bg:#faf9f5; --card:#fff; --line:#e8e6dc; --text:#141413; --dim:#6b6a64;
          --accent:#d97757; --ok:#5a8f5f; --bad:#c4574a; --warn:#d4a017; --voice:#6a6bbf;
          --serif:ui-serif, Georgia, "Times New Roman", serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#262624; --card:#30302e; --line:#3d3d3a; --text:#faf9f5; --dim:#a8a69c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
               font:16px/1.45 system-ui, -apple-system, sans-serif; }
  body { min-height:100dvh; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; }
  header::-webkit-scrollbar, #tabs::-webkit-scrollbar { display:none; }
  header h1 { font:600 18px var(--serif); letter-spacing:-.01em; margin:0; flex:1 0 auto; padding-right:8px; }
  @media (max-width: 600px) { header { display:none; } }
  .chip { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px;
          padding:6px 12px; font-size:14px; white-space:nowrap; }
  .chip.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--dim); }
  .dot.working { background:var(--warn); } .dot.idle { background:var(--ok); } .dot.off { background:var(--dim); opacity:.4; }
  #tabs { display:flex; gap:8px; padding:8px 12px; overflow-x:auto; scrollbar-width:none; }
  #top { position:sticky; top:0; z-index:5; background:var(--bg); padding-top:env(safe-area-inset-top); border-bottom:1px solid var(--line); }
  #app { display:flex; flex-direction:column; min-height:100dvh; }
  #feed { flex:1; min-height:30vh; padding:8px 12px; display:flex; flex-direction:column; gap:8px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
         white-space:pre-wrap; word-break:break-word; }
  .msg.prompt { align-self:flex-end; background:var(--accent); border-color:var(--accent); color:#fff; max-width:88%; }
  .msg { position:relative; }
  .say { position:absolute; top:6px; right:8px; background:none; color:var(--dim); padding:4px; border-radius:999px; line-height:0; }
  .say.on { color:var(--accent); }
  .say .ic { width:16px; height:16px; }
  .msg.summary { border-left:4px solid var(--ok); }
  .msg small { display:block; color:var(--dim); margin-bottom:2px; }
  .msg.prompt small { color:#fbe3d9; }
  .msg.info { background:none; border:none; color:var(--dim); font-size:13px; text-align:center; }
  .full { color:var(--dim); font-size:13px; margin-top:6px; text-decoration:underline; }
  #draft { margin:0 12px; background:var(--card); border:2px solid var(--ok); border-radius:12px; padding:10px 12px; }
  #draft small { color:var(--dim); display:block; margin-bottom:4px; }
  #draft .text { white-space:pre-wrap; word-break:break-word; max-height:25vh; overflow:auto; margin-bottom:10px; }
  button small { display:block; font-weight:400; font-size:12px; opacity:.85; margin-top:2px; }
  button:disabled { opacity:.35; }
  .modes { align-items:stretch; }
  .modes .seg { flex:1; }
  .ic { width:1.2em; height:1.2em; vertical-align:-0.2em; }
  .seg .ic { width:20px; height:20px; vertical-align:middle; }
  .lbl { align-self:center; color:var(--dim); font-size:13px; }
  .modes { gap:6px; }
  .modes .seg button { padding:8px 10px; }
  #mute { font-size:20px; padding:4px 16px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:999px; background:var(--card); padding:2px; }
  .seg button { flex:1; background:none; color:var(--dim); padding:8px 12px; font-size:15px; border-radius:999px; white-space:nowrap; }
  .seg button.on { background:color-mix(in srgb, var(--accent) 16%, var(--card)); color:var(--text); box-shadow:inset 0 0 0 1px var(--accent); }
  .note { font-size:13px; color:var(--dim); } .note[hidden] { display:none; }
  .row { display:flex; gap:10px; }
  .row[hidden] { display:none; }
  .busy { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 8px 8px 12px; color:var(--dim); }
  .busy .label { flex:1; }
  .busy button { flex:none; padding:8px 16px; font-size:14px; }
  .pulse { width:10px; height:10px; border-radius:50%; background:var(--accent); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.3; transform:scale(.8); } 50% { opacity:1; transform:scale(1.1); } }
  button { font:inherit; border:0; border-radius:12px; padding:16px; font-weight:500; color:#fff; background:var(--accent); flex:1; touch-action:manipulation; }
  button:active { transform:scale(.98); filter:brightness(.92); }
  button.ok { background:var(--ok); } button.bad { background:var(--bad); } button.dim { background:var(--card); color:var(--text); border:1px solid var(--line); }
  button.hold { background:var(--voice); user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  button.hold.down { background:var(--bad); }
  footer { position:sticky; bottom:0; z-index:5; background:var(--bg); padding:8px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .boxwrap { position:relative; }
  #clear { position:absolute; top:8px; right:8px; flex:none; padding:3px 10px; font-size:12px; border-radius:999px; }
  #clear[hidden] { display:none; }
  #text { width:100%; resize:none; max-height:30vh; font:inherit; padding:14px 64px 14px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); min-width:0; }
  #pair, #err { padding:32px 20px; text-align:center; }
  #pair h2 { font-family:var(--serif); font-weight:600; }
  .hidden { display:none !important; }
  body.watch #tabs, body.watch header h1 { display:none; }
  body.watch button { padding:28px 10px; font-size:20px; }
</style>
</head>
<body>
<div id="pair" class="hidden">
  <h2>Pair this phone</h2>
  <p id="pairmsg">On your computer run <b>/vibe qr</b> in Claude Code and scan the code.</p>
</div>
<div id="app" class="hidden">
  <div id="top">
  <div id="tabs"></div>
  <header>
    <h1>Claudio vibecode</h1>
  </header>
  </div>
  <div id="feed"></div>
  <footer>
    <div class="boxwrap">
      <textarea id="text" rows="2" placeholder="Message Claude. Type or tap Speak, then Send." autocomplete="off"></textarea>
      <button class="dim" id="clear" hidden aria-label="Clear the message">Clear</button>
    </div>
    <div class="row">
      <button class="ok" id="submit" style="font-size:20px;padding:20px">Send<small>same as pressing Enter</small></button>
    </div>
    <div class="row modes">
      <span class="lbl" data-i="mic" title="Microphone for Speak"></span>
      <div class="seg" role="group" aria-label="Which microphone Speak uses">
        <button id="micPC" title="Tap to speak with the computer's mic" data-i="monitor"></button>
        <button id="micPhone" title="Tap to speak with this phone's mic" data-i="smartphone"></button>
      </div>
      <span class="lbl" data-i="headphones" title="Where Claude's voice plays"></span>
      <div class="seg" role="group" aria-label="Where Claude's voice plays">
        <button id="outPC" title="Claude speaks on the computer" data-i="monitor"></button>
        <button id="outPhone" title="Claude speaks on this phone only" data-i="smartphone"></button>
      </div>
      <button class="chip" id="mute" title="Mute Claude's voice for this session" aria-label="Mute Claude's voice for this session" data-i="volume-2"></button>
    </div>
    <div class="row">
      <button class="hold" id="voice"></button>
    </div>
    <div class="note" id="micnote" hidden>The phone's mic needs Tailscale with HTTPS. Use your keyboard's mic key, or set Mic to PC.</div>
  </footer>
  <audio id="voiceout" playsinline></audio><audio id="keep" playsinline loop></audio>
</div>
<script>
const $ = (id) => document.getElementById(id);
let firstPaint = false, phoneMic = false;
// Lucide icons (lucide.dev, ISC licence), inlined so the page makes no external requests.
const ICONS = {
  monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
  smartphone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  headphones: '<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>',
  'volume-2': '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>',
  'volume-x': '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/>',
};
const ic = (n) => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
document.querySelectorAll('[data-i]').forEach((el) => { el.innerHTML = ic(el.dataset.i); });
// Two independent choices: which microphone Speak uses, and where Claude's voice plays ('pc' | 'phone').
let micSel = 'pc', outSel = 'pc';
try {
  const old = localStorage.getItem('mode') || (localStorage.getItem('listen') ? 'phone' : 'pc');
  const norm = (v) => (v === 'phone' ? 'phone' : 'pc');
  micSel = norm(localStorage.getItem('mic') || old); outSel = norm(localStorage.getItem('out') || old);
} catch (e) {}
let snap = null, current = null, stream = null;
if (location.pathname === '/w') document.body.classList.add('watch');

// Haptics: Android vibrates; iPhone Safari has no vibrate API, but toggling a hidden switch input clicks.
const tick = document.createElement('label');
tick.style.display = 'none';
tick.innerHTML = '<input type="checkbox" switch>';
document.head.appendChild(tick);
function haptic(kind) {
  const pattern = { tap: [10], ok: [12, 50, 12], warn: [40], down: [20], up: [8], error: [30, 40, 30, 40, 30] }[kind] || [10];
  try { if (navigator.vibrate && navigator.vibrate(pattern)) return; } catch (e) {}
  let t = 0;
  pattern.forEach((ms, i) => { if (i % 2 === 0) setTimeout(() => { try { tick.click(); } catch (e) {} }, t); t += ms; });
}
document.addEventListener('pointerdown', (e) => { if (e.target.closest('.chip:not(#mute), .seg button, #clear')) haptic('tap'); }, true);

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Claudio': '1' }, body: JSON.stringify(body) });
  let data = {}; try { data = await res.json(); } catch (e) {}
  return { status: res.status, data };
}
function show(which) { $('pair').classList.toggle('hidden', which !== 'pair'); $('app').classList.toggle('hidden', which !== 'app'); }

async function boot() {
  const code = new URLSearchParams(location.search).get('pair');
  if (code) {
    const r = await api('/api/pair', { code, name: navigator.platform || 'phone' });
    history.replaceState({}, '', location.pathname);
    if (r.status !== 200) { show('pair'); $('pairmsg').textContent = (r.data.error || 'Pairing failed') + '. Run /vibe qr again.'; return; }
  }
  const state = await api('/api/state');
  if (state.status === 401) { show('pair'); return; }
  show('app'); connect();
}
function connect() {
  if (stream) stream.close();
  stream = new EventSource('/api/stream');
  stream.onmessage = (m) => { snap = JSON.parse(m.data); render(); };
  stream.onerror = () => { stream.close(); setTimeout(connect, 2000); };
}
function sessionOf(id) { return snap.sessions.find((s) => s.id === id); }
// ---- Listen: speech from the computer plays on this phone ----
function silentWav(seconds) {
  const rate = 8000, n = rate * seconds, b = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); b.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true);
  b.setUint16(22, 1, true); b.setUint32(24, rate, true); b.setUint32(28, rate * 2, true); b.setUint16(32, 2, true);
  b.setUint16(34, 16, true); w(36, 'data'); b.setUint32(40, n * 2, true);
  let s = ''; new Uint8Array(b.buffer).forEach((x) => (s += String.fromCharCode(x)));
  return 'data:audio/wav;base64,' + btoa(s);
}
let listening = false, beat = null, played = new Set(), clips = [];
const out = $('voiceout'), keep = $('keep');
function pump() { if (!listening || !clips.length || !(out.paused || out.ended)) return; out.src = clips.shift(); out.play().catch(() => pump()); }
out.onended = pump; out.onerror = pump;
async function setListening(on) {
  listening = on;
  if (on) {
    keep.src = silentWav(1);  // a silent loop keeps the page alive with the screen off
    try { await keep.play(); out.src = silentWav(1); await out.play(); } catch (e) { listening = false; haptic('error'); render(); return; }
    if (listening) {
      if (snap) snap.audio.forEach((c) => played.add(c.id));
      const tell = () => api('/api/listen', { on: true });
      tell(); beat = setInterval(tell, 8000);
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: 'Claudio is listening', artist: 'claudio-vibecode' });
    }
  } else {
    clearInterval(beat); keep.pause(); out.pause(); clips = []; api('/api/listen', { on: false });
  }
  haptic('ok'); render();
}
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
async function setOut(next) {
  outSel = next; save('out', next);
  if (next === 'phone') { await setListening(true); if (listening) api('/api/localsound', { on: false }); }
  else { await setListening(false); api('/api/localsound', { on: true }); }
  render();
}
function setMic(next) { micSel = next; save('mic', next); stopDictation(); release(); render(); }
$('micPC').onclick = () => setMic('pc');
$('micPhone').onclick = () => setMic('phone');
$('outPC').onclick = () => setOut('pc');
$('outPhone').onclick = () => setOut('phone');
// After a reload, phone audio needs a tap before the browser allows sound: the first tap anywhere resumes it.
let resuming = null;
function resumeOut() {
  if (outSel !== 'phone' || listening) return resuming;
  if (!resuming) resuming = setListening(true).then(() => { if (listening) api('/api/localsound', { on: false }); }).finally(() => { resuming = null; });
  return resuming;
}
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#outPC')) resumeOut(); }, true);
function takeClips() {
  if (!listening || !snap) return;
  snap.audio.forEach((c) => { if (!played.has(c.id)) { played.add(c.id); clips.push('/api/audio/' + c.id); } });
  pump();
}

function render() {
  if (!snap) return;
  $('micPC').classList.toggle('on', micSel === 'pc');
  $('micPhone').classList.toggle('on', micSel === 'phone');
  $('outPC').classList.toggle('on', outSel === 'pc');
  $('outPhone').classList.toggle('on', outSel === 'phone');
  takeClips();
  if (!current) { try { current = localStorage.getItem('session'); } catch (e) {} }
  if (!current || !sessionOf(current)) {
    // Open on the session that did something last (that is the one you are working in).
    const ranked = [...snap.sessions].sort((a, b) => (b.online - a.online) || (b.last - a.last));
    current = ranked.length ? ranked[0].id : null;
  }
  const me = sessionOf(current);
  $('mute').hidden = !me || me.muted === null || me.muted === undefined;  // claudio-tts not reporting
  const voiceOn = !!me && !me.muted;
  $('mute').innerHTML = ic(voiceOn ? 'volume-2' : 'volume-x');
  $('mute').title = $('mute').ariaLabel = voiceOn ? 'Voice on. Tap to mute this session' : 'Voice muted. Tap to unmute this session';
  $('mute').classList.toggle('on', !!me && !me.muted);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  phoneMic = !!(micSel === 'phone' && snap.mic && window.isSecureContext && SR);
  const noMic = micSel === 'phone' && !phoneMic;
  vb.parentElement.hidden = noMic; $('micnote').hidden = !noMic;
  if (!held && !rec) idleSpeak();
  $('tabs').innerHTML = '';
  const names = snap.sessions.map((s) => s.name);
  [...snap.sessions].sort((a, b) => b.last - a.last).forEach((s) => {
    const b = document.createElement('button');
    b.className = 'chip' + (s.id === current ? ' on' : '');
    b.innerHTML = '<span class="dot ' + (s.online ? s.status : 'off') + '"></span>';
    b.append(names.filter((n) => n === s.name).length > 1 ? s.name + ' ' + s.id.slice(0, 4) : s.name);
    b.onclick = () => { current = s.id; try { localStorage.setItem('session', s.id); } catch (e) {} render(); };
    $('tabs').append(b);
  });
  if (!snap.sessions.length) $('tabs').textContent = 'No Claude session is connected. Start one, or type /vibe on.';
  const doc = document.documentElement;
  const near = !firstPaint || doc.scrollHeight - window.scrollY - window.innerHeight < 200;
  firstPaint = true;
  $('feed').innerHTML = '';
  const mine = snap.events.filter((e) => e.session === current);
  mine.forEach(addEvent);
  const cur = sessionOf(current);
  if (cur && cur.status === 'working') addWorking(mine);
  if (near) window.scrollTo(0, doc.scrollHeight);
  syncText(cur ? cur.draft || '' : '');
}
// Claude is busy: a row at the end of the feed, with the Stop button next to it.
let workingSince = 0;
function addWorking(events) {
  const lastPrompt = [...events].reverse().find((e) => e.kind === 'prompt');
  workingSince = lastPrompt ? lastPrompt.ts : 0;
  const d = document.createElement('div'); d.className = 'busy';
  d.innerHTML = '<span class="pulse"></span><span class="label">Claude is working… <span id="elapsed"></span></span>';
  const stop = document.createElement('button'); stop.className = 'bad'; stop.textContent = 'Stop';
  stop.setAttribute('aria-label', 'Stop Claude');
  stop.onclick = () => { haptic('warn'); api('/api/cancel', { session: current }); };
  d.append(stop); $('feed').append(d); tickElapsed();
}
function tickElapsed() {
  const el = $('elapsed'); if (!el) return;
  const sec = Math.max(0, Math.round(Date.now() / 1000 - workingSince));
  el.textContent = workingSince ? (sec >= 60 ? Math.floor(sec / 60) + 'm ' : '') + (sec % 60) + 's' : '';
}
setInterval(tickElapsed, 1000);
// Read one message aloud through claudio-tts: on the phone when Output is Phone, else on the computer. Tap again to stop.
let speakingBtn = null, speakingTimer = null;
function speakDone() { clearTimeout(speakingTimer); if (speakingBtn) speakingBtn.classList.remove('on'); speakingBtn = null; }
async function speakHere(text, btn) {
  haptic('tap');
  const wasThis = speakingBtn === btn;
  speakDone();
  if (wasThis) { api('/api/speak', { session: current, stop: true }); return; }
  speakingBtn = btn; btn.classList.add('on');
  speakingTimer = setTimeout(speakDone, Math.max(3000, text.length * 70));  // rough length of the speech
  await resumeOut();
  const r = await api('/api/speak', { session: current, text });
  if (r.status !== 200) { speakDone(); haptic('error'); }
}
function addEvent(e) {
  const d = document.createElement('div');
  const time = new Date(e.ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (e.kind === 'prompt') { d.className = 'msg prompt'; d.innerHTML = '<small>' + time + '</small>'; d.append(e.text); }
  else if (e.kind === 'reply') {
    d.className = 'msg' + (e.summary ? ' summary' : '');
    d.innerHTML = '<small>Claude ' + time + '</small>';
    const t = document.createElement('div'); t.textContent = e.summary || e.text; d.append(t);
    const sp = document.createElement('button'); sp.className = 'say'; sp.innerHTML = ic('volume-2');
    sp.title = sp.ariaLabel = 'Read this message aloud';
    sp.onclick = () => speakHere(t.textContent, sp);
    d.append(sp);
    if (e.summary && e.summary !== e.text) {
      const f = document.createElement('div'); f.className = 'full'; f.textContent = 'Show full reply';
      f.onclick = () => { t.textContent = t.textContent === e.summary ? e.text : e.summary; f.textContent = t.textContent === e.summary ? 'Show full reply' : 'Show summary'; };
      d.append(f);
    }
  } else { d.className = 'msg info'; d.textContent = e.text; }
  $('feed').append(d);
}
// One text box, mirrored with the prompt box on the computer: dictation fills it, edits go back.
const box = $('text');
let dirty = false, lastPushed = null, pushTimer = null, shownFor = null;
let dictating = false;  // while true the box belongs to the microphone
function syncText(remote) {
  if (dictating) return;
  if (shownFor !== current) { box.value = remote; shownFor = current; dirty = false; lastPushed = remote; }
  else if (remote !== lastPushed && !(dirty && document.activeElement === box)) { box.value = remote; lastPushed = remote; dirty = false; }
  refresh();
}
function pushText() {
  clearTimeout(pushTimer);
  if (!current) return Promise.resolve();
  lastPushed = box.value; dirty = false;
  return api('/api/draft', { session: current, text: box.value });
}
box.addEventListener('input', () => {
  dirty = true; refresh();
  clearTimeout(pushTimer); pushTimer = setTimeout(pushText, 400);
});
$('submit').onclick = async () => {
  const text = box.value.trim();
  if (!current || !text) return;
  clearTimeout(pushTimer);
  box.value = ''; lastPushed = ''; dirty = false; refresh();
  const r = await api('/api/submit', { session: current, text });
  haptic(r.status === 200 ? 'ok' : 'error');
  if (r.status !== 200) { box.value = text; refresh(); alert(r.data.error || 'Could not send'); }
};
$('clear').onclick = () => { box.value = ''; refresh(); pushText(); box.blur(); };
function refresh() { $('submit').parentElement.hidden = !box.value.trim(); $('clear').hidden = !box.value; }
$('mute').onclick = () => { const me = sessionOf(current); if (me) api('/api/mute', { session: current, on: !me.muted }).then(() => haptic('ok')); };

// Speak: one button, tap to start, tap to stop. Phone mic (https): the browser listens. Computer mic: the hub
// holds Claude's voice key on the computer until the second tap.
let held = false;
async function voice(action) {
  const r = await api('/api/voice', { session: current, action });
  if (r.status !== 200 && action === 'down') { held = false; $('voice').classList.remove('down'); alert(r.data.error || 'Voice key not available'); }
}
const vb = $('voice');
function idleSpeak() {
  vb.innerHTML = ic('mic') + (phoneMic ? ' Tap to speak<small>uses this phone\'s mic</small>' : ' Tap to speak<small>uses the computer\'s mic</small>');
}
let heldTimer = null;
const release = () => { if (!held) return; held = false; clearTimeout(heldTimer); vb.classList.remove('down'); idleSpeak(); voice('up'); haptic('up'); };
vb.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (phoneMic) { toggleDictation(); return; }
  if (held) { release(); return; }
  if (!current) return;
  held = true; vb.classList.add('down'); haptic('down'); vb.innerHTML = ic('mic') + ' Listening… tap to stop';
  heldTimer = setTimeout(release, 85000);  // the hub lets go of the key after 90 s
  voice('down');
});
vb.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('pagehide', release);
// Phone mic: the browser's speech recognition fills the text box (needs https, so Tailscale).
// The browser vendor's speech service hears the audio; nothing goes through the hub.
let rec = null;
function stopDictation() { if (rec) rec.stop(); }
function toggleDictation() {
  if (rec) { stopDictation(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || !current) return;
  const base = box.value.trim();
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  rec.onresult = (e) => {
    // Safari gives segments without a leading space, so join them ourselves.
    const parts = [base];
    for (let i = 0; i < e.results.length; i++) parts.push(e.results[i][0].transcript.trim());
    box.value = parts.filter(Boolean).join(' '); dirty = true; refresh();
  };
  rec.onerror = (e) => { if (e.error !== 'no-speech' && e.error !== 'aborted') alert(e.error === 'not-allowed' ? 'Allow the microphone for this page in the browser settings.' : 'Dictation error: ' + e.error); };
  rec.onend = () => { rec = null; dictating = false; vb.classList.remove('down'); idleSpeak(); haptic('up'); pushText(); };
  vb.classList.add('down'); vb.textContent = '⏹ Tap to stop'; haptic('down');
  dictating = true; rec.start();
}
window.addEventListener('pagehide', stopDictation);
boot();
</script>
</body>
